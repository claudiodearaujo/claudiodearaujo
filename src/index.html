<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Cláudio Araújo — Software Engineering, AI Engineering & Technical Leadership</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Engenharia de software, arquitetura, inteligência artificial, sistemas de agentes e liderança técnica."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#090b10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('theme');
          const preferred = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark' ? saved : preferred;
        } catch {
          /* use CSS prefers-color-scheme fallback */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
