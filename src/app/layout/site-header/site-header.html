<header class="site-header">
  <div class="page-shell site-header__inner">
    <a class="brand" [routerLink]="homePath" [attr.aria-label]="text.brandHome">
      <span class="brand__mark" aria-hidden="true">CA</span>
      <span class="brand__name">Cláudio Araújo</span>
    </a>

    <nav class="desktop-nav" [attr.aria-label]="text.primaryNav">
      @for (link of links; track link.route) {
        <a [routerLink]="link.route" routerLinkActive="is-active">{{ link.label }}</a>
      }
      <a class="contact-link" [routerLink]="contactPath">Contact</a>
    </nav>

    <div class="header-actions">
      @if (hasLanguageChoice) {
        <nav class="locale-nav" [attr.aria-label]="text.chooseLanguage">
          @for (option of locales; track option.locale) {
            <a
              [routerLink]="option.path"
              [attr.aria-current]="option.isCurrent ? 'true' : null"
              [attr.lang]="option.locale"
              >{{ option.label }}</a
            >
          }
        </nav>
      }
      <!-- Both glyphs are always rendered and CSS shows one, so this markup is
           identical on the server and in the browser whatever the reader's
           theme is. Rendering the active glyph from a signal made the
           prerendered HTML disagree with the theme the inline boot script had
           already applied, until hydration reconciled it (D18). -->
      <button
        class="theme-toggle"
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="text.toggleTheme"
      >
        <span class="theme-toggle__glyph theme-toggle__glyph--dark" aria-hidden="true">☀</span>
        <span class="theme-toggle__glyph theme-toggle__glyph--light" aria-hidden="true">◐</span>
      </button>
      <button
        #menuButton
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
      >
        {{ menuOpen() ? text.closeMenu : text.openMenu }}
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav #mobileNav id="mobile-menu" class="mobile-nav" [attr.aria-label]="text.mobileNav">
      @for (link of links; track link.route) {
        <a [routerLink]="link.route" routerLinkActive="is-active" (click)="closeMenu()">
          {{ link.label }}
        </a>
      }
      <a [routerLink]="contactPath" (click)="closeMenu()">Contact</a>
      <a href="https://github.com/claudiodearaujo" target="_blank" rel="me noreferrer">GitHub</a>
      <a href="https://br.linkedin.com/in/claudio-de-araujo" target="_blank" rel="me noreferrer"
        >LinkedIn</a
      >
    </nav>
  }
</header>
