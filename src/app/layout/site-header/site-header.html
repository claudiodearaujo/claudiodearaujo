<header class="site-header">
  <div class="page-shell site-header__inner">
    <a class="brand" routerLink="/pt" aria-label="Cláudio Araújo — início">
      <span class="brand__mark" aria-hidden="true">CA</span>
      <span class="brand__name">Cláudio Araújo</span>
    </a>

    <nav class="desktop-nav" aria-label="Navegação principal">
      @for (link of links; track link[1]) {
        <a [routerLink]="link[1]" routerLinkActive="is-active">{{ link[0] }}</a>
      }
      <a class="contact-link" routerLink="/pt/contact">Contact</a>
    </nav>

    <div class="header-actions">
      <!-- Both glyphs are always rendered and CSS shows one, so this markup is
           identical on the server and in the browser whatever the reader's
           theme is. Rendering the active glyph from a signal made the
           prerendered HTML disagree with the theme the inline boot script had
           already applied, until hydration reconciled it (D18). -->
      <button
        class="theme-toggle"
        type="button"
        (click)="theme.toggle()"
        aria-label="Alternar tema"
      >
        <span class="theme-toggle__glyph theme-toggle__glyph--dark" aria-hidden="true">☀</span>
        <span class="theme-toggle__glyph theme-toggle__glyph--light" aria-hidden="true">◐</span>
      </button>
      <button
        #menuButton
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-menu"
      >
        {{ menuOpen() ? 'Fechar' : 'Menu' }}
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav #mobileNav id="mobile-menu" class="mobile-nav" aria-label="Navegação móvel">
      @for (link of links; track link[1]) {
        <a [routerLink]="link[1]" routerLinkActive="is-active" (click)="closeMenu()">
          {{ link[0] }}
        </a>
      }
      <a routerLink="/pt/contact" (click)="closeMenu()">Contact</a>
      <a href="https://github.com/claudiodearaujo" target="_blank" rel="me noreferrer">GitHub</a>
      <a href="https://br.linkedin.com/in/claudio-de-araujo" target="_blank" rel="me noreferrer"
        >LinkedIn</a
      >
    </nav>
  }
</header>
