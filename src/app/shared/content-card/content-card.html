<article class="content-card">
  <app-metadata-row
    [type]="entry().type"
    [status]="entry().status"
    [readingTime]="entry().readingTime"
    justify="between"
  />
  <h2>
    <a [routerLink]="entry().route">{{ entry().title }}</a>
  </h2>
  <p>{{ entry().summary }}</p>
  <div class="tag-row" [attr.aria-label]="text.tags">
    @for (tag of entry().tags; track tag) {
      @if (hasTopic(tag)) {
        <a class="tag" [routerLink]="topicRoute(tag)">{{ tag }}</a>
      } @else {
        <span class="tag">{{ tag }}</span>
      }
    }
  </div>
  <a class="text-link" [routerLink]="entry().route">{{ text.readEntry }}</a>
</article>
