<section class="page-shell index-hero">
  <p class="eyebrow">Topic</p>
  <h1>{{ label }}</h1>
  <p class="lead">Conteúdo marcado com {{ label }}.</p>
</section>
<section class="page-shell content-grid" [attr.aria-label]="label">
  @for (entry of entries; track entry.route) {
    <app-content-card [entry]="entry" />
  }
</section>
