<article class="page-shell detail-shell">
  <app-breadcrumb [items]="breadcrumb" />
  <header class="detail-header">
    <app-metadata-row
      [type]="entry.type"
      [status]="entry.status"
      [readingTime]="entry.readingTime"
    />
    <h1>{{ entry.title }}</h1>
    <p class="lead">{{ entry.summary }}</p>
    <div class="tag-row">
      @for (tag of entry.tags; track tag) {
        <a class="tag" [routerLink]="topicRoute(tag)">{{ tag }}</a>
      }
    </div>
  </header>
  <div class="detail-layout">
    <div class="prose" [innerHTML]="safeHtml"></div>
    @if (entry.headings.length) {
      <app-table-of-contents [headings]="entry.headings" />
    }
  </div>
</article>

@if (related.length) {
  <section class="page-shell related">
    <p class="eyebrow">Related</p>
    <h2>Continue explorando</h2>
    <div class="related-grid">
      @for (item of related; track item.route) {
        <app-content-card [entry]="item" />
      }
    </div>
  </section>
}
