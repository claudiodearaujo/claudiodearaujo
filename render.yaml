services:
  - type: web
    runtime: static
    name: claudiodearaujo-site
    buildCommand: npm ci && npm run validate
    staticPublishPath: ./dist/claudiodearaujo/browser
    domains:
      - claudiodearaujo.dev.br
    autoDeployTrigger: commit
    previews:
      generation: automatic
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-Q6VozweQfbGqyCllZWLRqY/r2Cg4Y8Aag0g2HJENAoo=' 'sha256-VM2mZqyEQZoLzoTrp5EigFvzQ0+f1wSeBuoOn95WHCg=' 'sha256-jS9F0fZE6iYB/2op+WCudFkCeGoozd3p/gD7ba3TGRc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
