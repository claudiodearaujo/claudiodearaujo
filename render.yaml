services:
  - type: web
    runtime: static
    name: claudiodearaujo-site
    buildCommand: npm ci && npm run validate
    staticPublishPath: ./dist/claudiodearaujo/browser
    autoDeployTrigger: commit
    previews:
      generation: automatic
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
